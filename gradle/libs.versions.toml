[versions]
netty = "4.2.19.Final"
gson = "2.15.0"
slf4j = "2.0.20"
logback = "1.6.6"
faststats = "0.31.0"
fastutil = "8.5.19"
adventure = "5.2.0"
guava = "33.7.2-jre"
brigadier = "1.3.11"
jetbrains-annotations = "26.1.0"
jspecify = "1.0.1"
jline = "4.4.8"
classgraph = "6.0.1"
shadow = "9.6.1"
dfu = "11.0.22"
adventure-nbt-dfu = "0.1.2"
spark = "1.10.182-SNAPSHOT"
spark-api = "0.1-SNAPSHOT"
leafpile = "1.3.2"
configurate = "4.3.0-SNAPSHOT"
configurate-geyser = "4.3.0-GeyserMC"
lz4 = "1.12.1"
zstd-jni = "1.5.7-24"

[libraries]
netty-buffer = { module = "io.netty:netty-buffer", version.ref = "netty" }
netty-common = { module = "io.netty:netty-common", version.ref = "netty" }
netty-codec = { module = "io.netty:netty-codec-base", version.ref = "netty" }
netty-transport = { module = "io.netty:netty-transport", version.ref = "netty" }
netty-unix-common = { module = "io.netty:netty-transport-native-unix-common", version.ref = "netty" }
netty-epoll-classes = { module = "io.netty:netty-transport-classes-epoll", version.ref = "netty" }
netty-kqueue-classes = { module = "io.netty:netty-transport-classes-kqueue", version.ref = "netty" }
netty-iouring-classes = { module = "io.netty:netty-transport-classes-io_uring", version.ref = "netty" }
netty-epoll = { module = "io.netty:netty-transport-native-epoll", version.ref = "netty" }
netty-kqueue = { module = "io.netty:netty-transport-native-kqueue", version.ref = "netty" }
netty-iouring = { module = "io.netty:netty-transport-native-io_uring", version.ref = "netty" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
brigadier = { module = "com.mojang:brigadier", version.ref = "brigadier" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
faststats-core = { module = "dev.faststats.metrics:core", version.ref = "faststats" }
faststats-config = { module = "dev.faststats.metrics:config", version.ref = "faststats" }
adventure-api = { module = "net.kyori:adventure-api", version.ref = "adventure" }
adventure-key = { module = "net.kyori:adventure-key", version.ref = "adventure" }
adventure-nbt = { module = "net.kyori:adventure-nbt", version.ref = "adventure" }
adventure-nbt-dfu = { module = "io.papermc:adventurex-nbt-dfu", version.ref = "adventure-nbt-dfu" }
adventure-text-serializer-gson = { module = "net.kyori:adventure-text-serializer-gson", version.ref = "adventure" }
adventure-text-serializer-plain = { module = "net.kyori:adventure-text-serializer-plain", version.ref = "adventure" }
adventure-text-serializer-ansi = { module = "net.kyori:adventure-text-serializer-ansi", version.ref = "adventure" }
adventure-text-minimessage = { module = "net.kyori:adventure-text-minimessage", version.ref = "adventure" }
adventure-text-logger-slf4j = { module = "net.kyori:adventure-text-logger-slf4j", version.ref = "adventure" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
jetbrains-annotations = { module = "org.jetbrains:annotations", version.ref = "jetbrains-annotations" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
jline-ffm = { module = "org.jline:jline-terminal-ffm", version.ref = "jline" }
jline-reader = { module = "org.jline:jline-reader", version.ref = "jline" }
classgraph = { module = "io.github.classgraph:classgraph", version.ref = "classgraph" }
fastutil = { module = "it.unimi.dsi:fastutil", version.ref = "fastutil" }
dfu = { module = "com.mojang:datafixerupper", version.ref = "dfu" }
spark-common = { module = "me.lucko:spark-common", version.ref = "spark" }
spark-api = { module = "me.lucko:spark-api", version.ref = "spark-api" }
leafpile-common = { module = "ca.spottedleaf.leafpile:common", version.ref = "leafpile" }
leafpile-converter = { module = "ca.spottedleaf.leafpile:converter", version.ref = "leafpile" }
leafpile-concurrentutil = { module = "ca.spottedleaf.leafpile:concurrentutil", version.ref = "leafpile" }
configurate-yaml = { module = "org.spongepowered:configurate-yaml", version.ref = "configurate-geyser" }
configurate-extra-dfu = { module = "org.spongepowered:configurate-extra-dfu7", version.ref = "configurate" }
lz4-java = { module = "at.yawk.lz4:lz4-java", version.ref = "lz4" }
zstd-jni = { module = "com.github.luben:zstd-jni", version.ref = "zstd-jni" }

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
blossom = { id = "net.kyori.blossom", version = "2.2.0" }

[bundles]
netty = [
    "netty-buffer",
    "netty-common",
    "netty-codec",
    "netty-transport",
    "netty-unix-common",
    "netty-epoll-classes",
    "netty-kqueue-classes",
    "netty-iouring-classes"
]

adventure = [
    "adventure-api",
    "adventure-key",
    "adventure-nbt",
    "adventure-text-serializer-gson",
    "adventure-text-minimessage",
    "adventure-text-logger-slf4j"
]

leafpile = [
    "leafpile-common",
    "leafpile-converter",
    "leafpile-concurrentutil"
]
