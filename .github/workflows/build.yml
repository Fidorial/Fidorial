name: Build

on:
  workflow_call:
    inputs:
      upload-jar:
        description: "Publish the fat jar as an artifact"
        type: boolean
        default: false
      artifact-name:
        description: "Name of the uploaded artifact"
        type: string
        default: fidorial-server
      retention-days:
        description: "How long the artifact is kept"
        type: number
        default: 7
      publish-api:
        description: "Publish fidorial-api to repo.euphyllia.moe"
        type: boolean
        default: false
    secrets:
      NEXUS_USERNAME:
        description: "User publishing to repo.euphyllia.moe"
        required: false
      NEXUS_PASSWORD:
        description: "Password of that user"
        required: false
    outputs:
      version:
        description: "Version declared in gradle.properties"
        value: ${{ jobs.build.outputs.version }}
      build-number:
        description: "Build number in the versions, counted from the last change of minecraftVersion"
        value: ${{ jobs.build.outputs.build-number }}
      maven-version:
        description: "Version of the Maven artifacts, as computed by settings.gradle.kts"
        value: ${{ jobs.build.outputs.maven-version }}
      artifact-url:
        description: "Artifact download URL (requires being signed in to GitHub)"
        value: ${{ jobs.build.outputs.artifact-url }}
      jar-name:
        description: "File name of the built fat jar"
        value: ${{ jobs.build.outputs.jar-name }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      build-number: ${{ steps.build-number.outputs.number }}
      version: ${{ steps.version.outputs.version }}
      maven-version: ${{ steps.version.outputs.maven-version }}
      artifact-url: ${{ steps.upload.outputs.artifact-url }}
      jar-name: ${{ steps.jar.outputs.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Counted on the branch itself, so that builds of different branches do not share one sequence;
      # needs the whole history (fetch-depth: 0). settings.gradle.kts reads BUILD_NUMBER.
      - name: Compute build number
        id: build-number
        run: |
          set -euo pipefail
          base=$(git log -1 --format=%H -G'^[[:space:]]*minecraftVersion[[:space:]]*[=:]' -- gradle.properties)
          if [ -n "$base" ]; then
            number=$(( $(git rev-list --count "$base..HEAD") + 1 ))
          else
            number=$(git rev-list --count HEAD)
          fi
          echo "BUILD_NUMBER=$number" >> "$GITHUB_ENV"
          echo "number=$number" >> "$GITHUB_OUTPUT"
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # Includes Gradle caching and wrapper validation
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Read version
        id: version
        run: |
          set -euo pipefail
          version=$(./gradlew --quiet printVersion | tail -n 1)
          echo "maven-version=$version" >> "$GITHUB_OUTPUT"

      # Also checks formatting
      - name: Build and test
        run: ./gradlew build

      - name: Publish the API
        if: inputs.publish-api
        env:
          # repository secrets first, repository variables otherwise
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME || vars.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD || vars.NEXUS_PASSWORD }}
          MAVEN_VERSION: ${{ steps.version.outputs.maven-version }}
        run: |
          set -euo pipefail
          if [ -z "$NEXUS_USERNAME" ] || [ -z "$NEXUS_PASSWORD" ]; then
            echo "::error::NEXUS_USERNAME and NEXUS_PASSWORD are neither repository secrets nor variables"
            exit 1
          fi
          ./gradlew :fidorial-api:publish
          echo "::notice::Published fr.fidorial:fidorial-api:$MAVEN_VERSION"
          echo "Published \`fr.fidorial:fidorial-api:$MAVEN_VERSION\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Collect jar metadata
        id: jar
        if: inputs.upload-jar
        run: |
          jar=$(ls fidorial-server/build/libs/*.jar | head -1)
          echo "name=$(basename "$jar")" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$jar" | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload jar
        id: upload
        if: inputs.upload-jar
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
          path: fidorial-server/build/libs/*.jar
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}