name: Build

on:
  workflow_call:
    inputs:
      upload-jar:
        description: "Publish the fat jar as an artifact"
        type: boolean
        default: false
      artifact-name:
        description: "Name of the uploaded artifact"
        type: string
        default: fidorial-server
      retention-days:
        description: "How long the artifact is kept"
        type: number
        default: 7
    outputs:
      version:
        description: "Version declared in gradle.properties"
        value: ${{ jobs.build.outputs.version }}
      artifact-url:
        description: "Artifact download URL (requires being signed in to GitHub)"
        value: ${{ jobs.build.outputs.artifact-url }}
      jar-name:
        description: "File name of the built fat jar"
        value: ${{ jobs.build.outputs.jar-name }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact-url: ${{ steps.upload.outputs.artifact-url }}
      jar-name: ${{ steps.jar.outputs.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      # Includes Gradle caching and wrapper validation
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read version
        id: version
        run: |
          fidorialVersion=$(grep -m1 -E '^fidorialVersion[[:space:]]*=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          if [ -z "$fidorialVersion" ]; then
            echo "::error::fidorialVersion not found in gradle.properties"
            exit 1
          fi
          echo "version=$fidorialVersion" >> "$GITHUB_OUTPUT"

      - name: Format check
        run: ./gradlew spotlessCheck --no-daemon

      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Collect jar metadata
        id: jar
        if: inputs.upload-jar
        run: |
          jar=$(ls fidorial-server/build/libs/*.jar | head -1)
          echo "name=$(basename "$jar")" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$jar" | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload jar
        id: upload
        if: inputs.upload-jar
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: fidorial-server/build/libs/*.jar
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
