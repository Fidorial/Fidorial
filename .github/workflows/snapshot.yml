name: Snapshot

on:
  push:
    branches: [ dev/26.3 ]
    paths-ignore:
      - '**.md'
      - 'LICENCE'
      - '.gitattributes'
  workflow_dispatch:

concurrency:
  group: snapshot
  cancel-in-progress: true

jobs:
  build:
    # Skipped when the head commit message contains [ci-skip]
    if: ${{ !contains(github.event.head_commit.message, '[ci-skip]') }}
    uses: ./.github/workflows/build.yml
    with:
      upload-jar: true
      retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download jar
        uses: actions/download-artifact@v4
        with:
          name: fidorial-server
          path: dist

      - name: Compute release name
        id: meta
        env:
          BASE: ${{ needs.build.outputs.version }}
        run: |
          # 0.1.0-SNAPSHOT -> 0.1.0-dev.42
          base="${BASE%-SNAPSHOT}"
          echo "version=${base}-dev.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Publish development pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-${{ github.run_number }}
          name: Fidorial ${{ steps.meta.outputs.version }}
          prerelease: true
          files: dist/*.jar
          generate_release_notes: true
          body: |
            Automated development build from `${{ github.ref_name }}`.
            Commit: ${{ steps.meta.outputs.short_sha }}
  publish-api:
    name: Publish fidorial-api (SNAPSHOT)
    needs: build
    # Only the main branch feeds the shared SNAPSHOT, a manual run on another
    # branch must not overwrite it. Keep in sync with on.push.branches above.
    if: github.ref == 'refs/heads/dev/26.3'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish to repo.euphyllia.moe
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          if [ -z "$NEXUS_USERNAME" ] || [ -z "$NEXUS_PASSWORD" ]; then
            echo "::error::NEXUS_USERNAME / NEXUS_PASSWORD secrets are not set (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          ./gradlew :fidorial-api:publish --no-daemon

      - name: Summary
        run: |
          version=$(grep -m1 '^fidorialVersion' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          {
            echo "### fidorial-api published"
            echo
            echo '```kotlin'
            echo 'maven("https://repo.euphyllia.moe/repository/maven-public/")'
            echo "compileOnly(\"fr.fidorial:fidorial-api:${version}-SNAPSHOT\")"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"