name: Snapshot

on:
  push:
    branches: [ 'dev/**' ]
    paths-ignore:
      - '**.md'
      - 'LICENCE'
      - '.gitattributes'
  workflow_dispatch:

concurrency:
  group: snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Skipped when the head commit message contains [ci-skip]
    if: ${{ !contains(github.event.head_commit.message, '[ci-skip]') }}
    uses: ./.github/workflows/build.yml
    with:
      upload-jar: true
      retention-days: 14
      publish-api: true
    secrets: inherit

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download jar
        uses: actions/download-artifact@v8
        with:
          name: fidorial-server
          path: dist

      - name: Compute release name
        id: meta
        run: |
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Publish development pre-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: dev-${{ needs.build.outputs.maven-version }}
          target_commitish: ${{ github.sha }}
          name: Fidorial ${{ needs.build.outputs.maven-version }}
          prerelease: true
          files: dist/*.jar
          generate_release_notes: true
          body: |
            Automated development build from `${{ github.ref_name }}`.
            Commit: ${{ steps.meta.outputs.short_sha }}
            API: `fr.fidorial:fidorial-api:${{ needs.build.outputs.maven-version }}`
